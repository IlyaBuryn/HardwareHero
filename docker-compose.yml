version: '3.4'

networks:
  frontend:
  backend:
    driver: bridge
  elastic:
    driver: bridge
  monitoring:
    driver: bridge
     
services:  

  aggregator.api:
    container_name: Aggregator-api
    image: ${DOCKER_REGISTRY-}aggregatorapi
    volumes:
      - ./../Aggregator.DataAccess/Scripts:/root/app
    build:
      context: .
      dockerfile: Services/Aggregator/Aggregator.Api/Dockerfile
    networks:
      - backend
    environment:
      - Otel__Endpoint=http://otel-collector:4317
      - DB_HOST=hardwarehero.mssql
      - DB_NAME=HardwareHero.AggregatorDb
      - DB_SA_PASSWORD=password@#12345
    depends_on:
      - otel-collector

  contributor.api:
    container_name: Contributor-api
    image: ${DOCKER_REGISTRY-}contributorapi
    volumes:
      - ./../Contributor.DataAccess/Scripts:/root/app
    build:
      context: .
      dockerfile: Services/Contributor/Contributor.Api/Dockerfile
    networks:
      - backend
    environment:
      - Otel__Endpoint=http://otel-collector:4317
      - DB_HOST=hardwarehero.mssql
      - DB_NAME=HardwareHero.ContributorDb
      - DB_SA_PASSWORD=password@#12345
    depends_on:
      - otel-collector

  prices.api:
    container_name: Prices-api
    image: ${DOCKER_REGISTRY-}pricesapi
    build:
      context: .
      dockerfile: Services/Prices/Prices.Api/Dockerfile
    depends_on:
      - hardwarehero.mongo
      - otel-collector
    networks:
      - backend
    environment:
      - Otel__Endpoint=http://otel-collector:4317
      - DB_HOST=hardwarehero.mongo
      - DB_NAME=Prices      

  hardwarehero.mongo:
    container_name: HardwareHero-mongo
    image: mongo
    ports:
      - 8090:27017
    networks:
      - backend

  hardwarehero.mssql:
    container_name: HardwareHero-mssql
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=password@#12345
    volumes_from:
      - aggregator.api
    networks:
      - backend
    ports:
      - 8080:1433
 
  zookeeper:
    image: bitnami/zookeeper:latest
    ports:
      - "2181:2181"
    # volumes:
    #   - "zookeeper_data:/bitnami"
    networks:
      - backend
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka1:
    image: docker.io/bitnami/kafka:3.6
    ports:
      - "9092:9092"
    # volumes:
    #   - "kafka-data:/bitnami"
    networks:
      - backend
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka1:9092,EXTERNAL://kafka1:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_MAX_REQUEST_SIZE=209715200
      - KAFKA_CFG_SOCKET_REQUEST_MAX_BYTES=209715200
    depends_on:
      - zookeeper

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - 9100:8080
    networks:
      - backend
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      # KAFKA_CLUSTERS_0_JMXPORT: 9997
    depends_on:
      - kafka1
  
