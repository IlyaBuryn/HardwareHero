version: '3.5'
name: backend

networks:
  backend:
    driver: bridge
  web_frontend:
    external: true
  elastic:
    driver: bridge
  monitoring:
    driver: bridge
     
services:  

  aggregator.api:
    container_name: Aggregator-api
    image: ${DOCKER_REGISTRY-}aggregatorapi
    volumes:
      - ./../Aggregator.DataAccess/Scripts:/root/app
    build:
      context: .
      dockerfile: Services/Aggregator/Aggregator.Api/Dockerfile
    networks:
      - backend
    environment:
      - Otel__Endpoint=http://otel-collector:4317
      - DB_HOST=hardwarehero.mssql
      - DB_NAME=HardwareHero.AggregatorDb
      - DB_SA_PASSWORD=password@#12345
    depends_on:
      - otel-collector
      - identity.api

  contributor.api:
    container_name: Contributor-api
    image: ${DOCKER_REGISTRY-}contributorapi
    volumes:
      - ./../Contributor.DataAccess/Scripts:/root/app
    build:
      context: .
      dockerfile: Services/Contributor/Contributor.Api/Dockerfile
    networks:
      - backend
    environment:
      - Otel__Endpoint=http://otel-collector:4317
      - DB_HOST=hardwarehero.mssql
      - DB_NAME=HardwareHero.ContributorDb
      - DB_SA_PASSWORD=password@#12345
    depends_on:
      - otel-collector
      - identity.api

  prices.api:
    container_name: Prices-api
    image: ${DOCKER_REGISTRY-}pricesapi
    build:
      context: .
      dockerfile: Services/Prices/Prices.Api/Dockerfile
    depends_on:
      - hardwarehero.mongo
      - otel-collector
      - identity.api
    networks:
      - backend
    environment:
      - Otel__Endpoint=http://otel-collector:4317
      - DB_HOST=hardwarehero.mongo
      - DB_NAME=Prices      

  mail.api:
   container_name: Mail-api
   image: ${DOCKER_REGISTRY-}mailapi
   build:
     context: .
     dockerfile: Services/Mail/Mail.Api/Dockerfile
   depends_on:
     - hardwarehero.mongo
     - otel-collector
     - identity.api
   networks:
     - backend
   environment:
     - Otel__Endpoint=http://otel-collector:4317
     - DB_HOST=hardwarehero.mongo
     - DB_NAME=Mail

  hardwarehero.mongo:
    container_name: HardwareHero-mongo
    image: mongo
    ports:
      - 8090:27017
    networks:
      - backend

  hardwarehero.mssql:
    container_name: HardwareHero-mssql
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=password@#12345
    volumes_from:
      - aggregator.api
    networks:
      - backend
    ports:
      - 8080:1433
 
  zookeeper:
    image: confluentinc/cp-zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - backend
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000

  kafka1:
    image: confluentinc/cp-kafka
    ports:
      - "9092:9092"
    networks:
      - backend
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_BROKER_ID=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka1:9092
    depends_on:
      - zookeeper

  # kafka2:
  #   image: docker.io/bitnami/kafka:3.6
  #   ports:
  #     - "9082:9082"
  #   networks:
  #     - backend
  #   environment:
  #     - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
  #     - KAFKA_CFG_LISTENERS=PLAINTEXT://:9082,CONTROLLER://:9083,EXTERNAL://:9084
  #     - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka2:9082,EXTERNAL://kafka2:9084
  #     - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
  #     - KAFKA_CFG_MAX_REQUEST_SIZE=209715200
  #     - KAFKA_CFG_SOCKET_REQUEST_MAX_BYTES=209715200
  #     - KAFKA_CFG_BROKER_ID=2
  #   depends_on:
  #     - zookeeper

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - 9100:8080
    networks:
      - backend
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092 # ,kafka2:9082
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka1
      # - kafka2

  apigateway.ocelot:
   container_name: Ocelot
   image: ${DOCKER_REGISTRY-}apigatewayocelot
   build:
     context: .
     dockerfile: ApiGateway/ApiGateway.Ocelot/Dockerfile
   ports:
     - 8071:80
     - 8070:443
   networks:
     - backend
     - web_frontend

  configurator.api:
   container_name: Configurator-api
   image: ${DOCKER_REGISTRY-}configuratorapi
   build:
     context: .
     dockerfile: Services/Configurator/Configurator.Api/Dockerfile
   depends_on:
     - hardwarehero.mongo
     - otel-collector
   networks:
     - backend
   environment:
     - Otel__Endpoint=http://otel-collector:4317
     - DB_HOST=hardwarehero.mongo
     - DB_NAME=Configurator

  users.api:
   container_name: Users-api
   image: ${DOCKER_REGISTRY-}usersapi
   build:
     context: .
     dockerfile: Services/Identity/Users.Api/Dockerfile
   depends_on:
     - otel-collector
     - identity.api
   networks:
     - backend
   environment:
     - Otel__Endpoint=http://otel-collector:4317
     - DB_HOST=hardwarehero.mssql
     - DB_NAME=HardwareHero.Users
     - DB_SA_PASSWORD=password@#12345

  identity.api:
   container_name: Identity-api
   image: ${DOCKER_REGISTRY-}identityapi
   build:
     context: .
     dockerfile: Services/Identity/Identity.Api/Dockerfile
   depends_on:
     - otel-collector
   networks:
     - backend
   environment:
     - Otel__Endpoint=http://otel-collector:4317
     - DB_HOST=hardwarehero.mssql
     - DB_NAME=HardwareHero.IdentityServer
     - DB_SA_PASSWORD=password@#12345
     - SEED=/seed

